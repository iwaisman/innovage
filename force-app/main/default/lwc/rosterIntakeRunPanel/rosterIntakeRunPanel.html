<template>
    <lightning-card title={labels.title} icon-name="standard:data_streams">
        <div slot="actions">
            <lightning-button
                label={labels.startLabel}
                icon-name="utility:upload"
                variant="brand"
                disabled={startDisabled}
                onclick={handleStart}
            ></lightning-button>
        </div>
        <div class="slds-var-p-horizontal_medium slds-is-relative">
            <template lwc:if={busy}>
                <lightning-spinner alternative-text="Working" size="small"></lightning-spinner>
            </template>
            <template lwc:if={error}>
                <div class="slds-text-color_error slds-var-m-bottom_small" role="alert">{error}</div>
            </template>
            <template lwc:if={activeRun}>
                <div class="slds-grid slds-grid_vertical-align-center slds-var-m-bottom_x-small">
                    <div class="slds-col slds-grow">
                        <a href="#" onclick={handleOpenRun}>{activeRun.Name}</a>
                        <span class="slds-text-color_weak">&nbsp;· {activeRun.Status__c}</span>
                    </div>
                    <div class="slds-col slds-grow-none">
                        <lightning-button label="Cancel" disabled={busy} onclick={handleCancel}></lightning-button>
                    </div>
                </div>
                <template lwc:if={hasTotal}>
                    <lightning-progress-bar value={percentDone} size="large"></lightning-progress-bar>
                    <p class="slds-text-body_small slds-var-m-vertical_x-small">{progressSummary}</p>
                </template>
                <template lwc:else>
                    <p class="slds-text-body_small slds-text-color_weak slds-var-m-bottom_small">Waiting for the run to start…</p>
                </template>
            </template>
            <template lwc:else>
                <p class="slds-text-color_weak slds-var-m-bottom_small">{idleMessage}</p>
            </template>
        </div>
    </lightning-card>
</template>
