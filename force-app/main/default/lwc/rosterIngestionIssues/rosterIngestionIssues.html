<template>
    <lightning-card title={title} icon-name="standard:incident">
        <div slot="actions" class="slds-grid slds-grid_vertical-align-center">
            <lightning-radio-group
                name="severity"
                label="Show"
                variant="label-hidden"
                type="button"
                options={severityOptions}
                value={severity}
                onchange={handleSeverityChange}
            ></lightning-radio-group>
            <lightning-button-icon
                class="slds-var-m-left_x-small"
                icon-name="utility:refresh"
                alternative-text="Refresh"
                title="Refresh"
                onclick={handleRefresh}
            ></lightning-button-icon>
        </div>
        <div class="slds-var-p-horizontal_medium slds-is-relative">
            <template lwc:if={loading}>
                <lightning-spinner alternative-text="Loading issues" size="small"></lightning-spinner>
            </template>
            <template lwc:if={error}>
                <div class="slds-text-color_error slds-var-m-bottom_small" role="alert">{error}</div>
            </template>
            <template lwc:if={hasIssues}>
                <lightning-datatable
                    key-field="Id"
                    data={rows}
                    columns={columns}
                    hide-checkbox-column
                    column-widths-mode="auto"
                ></lightning-datatable>
                <div class="slds-grid slds-grid_align-spread slds-grid_vertical-align-center slds-var-m-vertical_small">
                    <p class="slds-text-body_small slds-text-color_weak">Showing {issues.length} of {totalCount}</p>
                    <template lwc:if={hasMore}>
                        <lightning-button label="Load more" disabled={loading} onclick={handleLoadMore}></lightning-button>
                    </template>
                </div>
            </template>
            <template lwc:elseif={loaded}>
                <p class="slds-text-color_weak slds-var-m-bottom_small">No issues for this run.</p>
            </template>
        </div>
    </lightning-card>
</template>
